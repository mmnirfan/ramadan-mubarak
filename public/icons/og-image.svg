<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="50%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.05">
    <pattern id="pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0L60 30L30 60L0 30Z" fill="none" stroke="#fcd34d" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#pattern)"/>
  </g>
  
  <!-- Floating lanterns (decorative) -->
  <g opacity="0.15" fill="#fcd34d">
    <ellipse cx="100" cy="150" rx="15" ry="25"/>
    <ellipse cx="1100" cy="200" rx="12" ry="20"/>
    <ellipse cx="150" cy="500" rx="10" ry="18"/>
    <ellipse cx="1050" cy="450" rx="14" ry="22"/>
  </g>
  
  <!-- Crescent Moon (left side) -->
  <g transform="translate(250, 315)">
    <circle cx="-10" cy="0" r="120" fill="url(#moonGradient)"/>
    <circle cx="40" cy="-25" r="95" fill="url(#bgGradient)"/>
  </g>
  
  <!-- Star next to moon -->
  <g transform="translate(340, 200)">
    <polygon 
      points="0,-35 8,-12 33,-12 14,4 22,30 0,14 -22,30 -14,4 -33,-12 -8,-12" 
      fill="url(#starGradient)"
    />
  </g>
  
  <!-- Small stars -->
  <g fill="#fcd34d" opacity="0.6">
    <circle cx="380" cy="160" r="5"/>
    <circle cx="400" cy="230" r="3"/>
    <circle cx="360" cy="260" r="4"/>
    <circle cx="200" cy="180" r="4"/>
    <circle cx="180" cy="400" r="3"/>
  </g>
  
  <!-- Text content -->
  <g transform="translate(500, 0)">
    <!-- Main title -->
    <text x="0" y="250" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="url(#textGradient)">
      RamadanHub
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="320" font-family="Arial, sans-serif" font-size="32" fill="#e2e8f0">
      Sehri Registration
    </text>
    
    <!-- Arabic text -->
    <text x="0" y="390" font-family="Arial, sans-serif" font-size="36" fill="#fcd34d" opacity="0.8">
      رمضان مبارك
    </text>
    
    <!-- Location -->
    <text x="0" y="460" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">
      Hoskote, Bengaluru Rural • Ramadan 2027
    </text>
  </g>
  
  <!-- Bottom decorative line -->
  <rect x="100" y="580" width="1000" height="2" fill="url(#moonGradient)" opacity="0.3" rx="1"/>
</svg>
