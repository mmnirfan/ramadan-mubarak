<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>
  
  <!-- Decorative pattern (subtle) -->
  <g opacity="0.1">
    <path d="M256 80 L276 120 L256 160 L236 120 Z" fill="#fcd34d"/>
    <path d="M256 352 L276 392 L256 432 L236 392 Z" fill="#fcd34d"/>
    <path d="M80 256 L120 276 L160 256 L120 236 Z" fill="#fcd34d"/>
    <path d="M352 256 L392 276 L432 256 L392 236 Z" fill="#fcd34d"/>
  </g>
  
  <!-- Crescent Moon -->
  <g transform="translate(256, 256)">
    <!-- Moon shape using two circles -->
    <circle cx="-20" cy="0" r="140" fill="url(#moonGradient)"/>
    <circle cx="40" cy="-30" r="110" fill="url(#bgGradient)"/>
  </g>
  
  <!-- Star -->
  <g transform="translate(340, 140)">
    <polygon 
      points="0,-45 10,-15 42,-15 18,5 28,38 0,18 -28,38 -18,5 -42,-15 -10,-15" 
      fill="url(#starGradient)"
    />
  </g>
  
  <!-- Small decorative stars -->
  <g fill="#fcd34d" opacity="0.6">
    <circle cx="400" cy="100" r="6"/>
    <circle cx="420" cy="180" r="4"/>
    <circle cx="380" cy="220" r="5"/>
  </g>
</svg>
